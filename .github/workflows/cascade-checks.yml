name: Cascade source checks
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-51:
    # No GitHub-hosted billing. Register a dedicated, trusted Windows x64 runner
    # through Repository Settings > Actions > Runners before requiring this check.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell source
        shell: powershell
        run: |
          $paths = @(Get-ChildItem . -Recurse -File | Where-Object { $_.Extension -in @('.ps1','.psm1','.psd1') })
          $failures = @()
          foreach ($p in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($p.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $failures += ($p.FullName + ': ' + ($errors | Out-String)) }
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host ("Parsed {0} PowerShell source files." -f $paths.Count)
      - name: Offline Windows PowerShell 5.1 tests
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\Invoke-CascadeTests.ps1 -Suite Offline
      - name: Nexus browser smoke test
        shell: cmd
        run: node tests\test-browser-smoke.js
      - name: Complete example hierarchy validation
        shell: cmd
        run: node tests\test-example-work-items.js
      - name: Browser WASM and capability probe
        shell: cmd
        run: node tests\test-stack-compatibility.js
      - name: Safe host stack probe (does not install anything)
        shell: cmd
        run: powershell.exe -NoProfile -File scripts\Test-CascadeStack.ps1
      - name: Intelligence review dialog and parent approvals
        shell: cmd
        run: node tests\test-review-dialog.js
      - name: Real API wiring check
        shell: cmd
        run: node tests\test-api-wiring.js
      - name: Nexus static integration check
        shell: cmd
        run: python tests\test-nexus-integration.py