name: Release
# Builds the workstation bundle (dist\Halyard-<version>.zip: DLLs, built UI, module, scripts; no .NET SDK
# or Node needed to run it) and attaches it to a GitHub release v<version>, <version> from Halyard.Core.csproj.
# Push a tag v<version>, or run this workflow by hand on main: it then creates the tag on the commit it built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build, test and assemble the bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-Xml -Path src\Halyard.Core\Halyard.Core.csproj -XPath '//Version').Node.InnerText
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in Halyard.Core.csproj"
          }
          .\build\Build-Halyard.ps1
          $zip = Join-Path $PWD "dist\Halyard-$version.zip"
          if (-not (Test-Path $zip)) { throw "Bundle $zip was not produced" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: halyard-release
          path: ${{ env.ZIP }}

      - name: Publish the GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Windows PowerShell 5.1 turns a native command's stderr into a terminating error under 'Stop'
          # ("release not found" when the tag is new), so rely on $LASTEXITCODE instead.
          $ErrorActionPreference = 'Continue'
          $tag = "v$env:VERSION"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Same version built again: replace the zip on the existing release.
            gh release upload $tag $env:ZIP --clobber
          } else {
            gh release create $tag $env:ZIP --target $env:GITHUB_SHA --title "Halyard $tag" --generate-notes
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
