name: Release
# Builds the workstation bundle (dist\Halyard-<version>.zip: the engine as C# source, built UI, module, scripts;
# no DLL inside, since the workstation blocks loading custom DLL files; no .NET SDK or Node needed to run it) and
# attaches it to a GitHub release v<version>, <version> from Halyard.Core.csproj.
# Push a tag v<version>, or run this workflow by hand on main: it then creates the tag on the commit it built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.426
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build, test and assemble the bundle
        id: bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-Xml -Path src\Halyard.Core\Halyard.Core.csproj -XPath '//Version').Node.InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-.][A-Za-z0-9.-]+)?$') { throw 'Invalid release version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in Halyard.Core.csproj"
          }
          .\build\Build-Halyard.ps1
          $zip = Join-Path $PWD "dist\Halyard-$version.zip"
          if (-not (Test-Path $zip)) { throw "Bundle $zip was not produced" }
          # The zip listing goes into the log; a DLL, EXE or PDB inside fails the release.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = @([IO.Compression.ZipFile]::OpenRead($zip).Entries | ForEach-Object { $_.FullName })
          $entries | ForEach-Object { Write-Host ('  ' + $_) }
          $bin = @($entries | Where-Object { $_ -match '(?i)\.(dll|exe|pdb)$' })
          if ($bin.Count -gt 0) { throw ('Bundle contains binaries: ' + ($bin -join ', ')) }
          $cs = @($entries | Where-Object { $_ -match '^src[\\/]Halyard\.Core[\\/].*\.cs$' }).Count
          if ($cs -lt 40) { throw "Bundle is missing the engine source ($cs .cs files)" }
          Write-Host "::notice title=Bundle::Halyard-$version.zip has $($entries.Count) entries, $cs engine .cs files and no DLL"
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halyard-release
          path: ${{ env.ZIP }}

  publish:
    needs: bundle
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: halyard-release
          path: dist
      - name: Publish the GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          # Windows PowerShell 5.1 turns a native command's stderr into a terminating error under 'Stop'
          # ("release not found" when the tag is new), so rely on $LASTEXITCODE instead.
          $ErrorActionPreference = 'Continue'
          $zip = Join-Path $PWD "dist\Halyard-$env:VERSION.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'The built release archive is missing' }
          $tag = "v$env:VERSION"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Same version built again: replace the zip on the existing release.
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title "Halyard $tag" --generate-notes
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
